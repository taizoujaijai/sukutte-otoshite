<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>試作1：見た目のテイスト</title>
<link rel="stylesheet" href="style.css">
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>
</head>
<body>
<div id="view"></div>
<header class="bar">
  <a href="./" class="back">← 試作一覧</a>
  <h1>試作1：見た目のテイスト</h1>
  <div class="seg" id="styles"></div>
  <div class="seg" id="shapes"></div>
  <button id="seat">席に戻る</button>
</header>
<p class="note" id="note"></p>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { createRenderer, applyStyle, onResize, disposeScene } from './common.js';
import { STYLES } from './prizes.js';
import { buildMachine, BASE_SHAPES } from './machine.js';

const NOTES = {
  toon: 'トゥーン調：輪郭線とベタ塗りの陰影。スマホでも軽く、景品の形が見分けやすい。',
  real: 'リアル調：プラスチックの光沢、透明なドームと宝石の映り込み、ゲームセンターの色付き照明。いちばん重い。',
  lowpoly: 'ローポリ：角ばった面で塗り分ける。いちばん軽く、絵本やおもちゃのような印象。',
};

const view = document.getElementById('view');
const renderer = createRenderer(view);
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(42, view.clientWidth / view.clientHeight, 0.1, 200);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.minDistance = 6;
controls.maxDistance = 40;
controls.maxPolarAngle = Math.PI * 0.49;
onResize(renderer, camera, view);

let machine;
const params = new URLSearchParams(location.search);
let style = params.get('style') || 'toon';
let shape = params.get('shape') || 'octagon';

function goSeat() {
  const v = machine.seatView(0);
  camera.position.copy(v.position);
  controls.target.copy(v.target);
  controls.update();
}

function build() {
  disposeScene(scene);
  applyStyle(scene, renderer, style, { shadowSize: 11, target: new THREE.Vector3(0, 8, 0) });
  machine = buildMachine(style, { shape });
  scene.add(machine.root);
  document.getElementById('note').textContent = NOTES[style];
  document.querySelectorAll('#styles button').forEach((b) => b.classList.toggle('on', b.dataset.style === style));
  document.querySelectorAll('#shapes button').forEach((b) => b.classList.toggle('on', b.dataset.shape === shape));
  history.replaceState(null, '', `?style=${style}&shape=${shape}`);
}

const seg = document.getElementById('styles');
for (const [key, label] of Object.entries(STYLES)) {
  const b = document.createElement('button');
  b.textContent = label;
  b.dataset.style = key;
  b.onclick = () => { style = key; build(); };
  seg.appendChild(b);
}
for (const [key, label] of Object.entries(BASE_SHAPES)) {
  const b = document.createElement('button');
  b.textContent = `土台：${label}`;
  b.dataset.shape = key;
  b.onclick = () => { shape = key; build(); };
  document.getElementById('shapes').appendChild(b);
}
document.getElementById('seat').onclick = goSeat;

build();
goSeat();

const clock = new THREE.Clock();
renderer.setAnimationLoop(() => {
  const dt = Math.min(clock.getDelta(), 0.05);
  machine.update(clock.elapsedTime, dt);
  controls.update();
  renderer.render(scene, camera);
});
</script>
</body>
</html>
